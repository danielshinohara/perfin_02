version: 2
updates:
  - package-ecosystem: npm
    directory: /Aplicativo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 ainda não é suportado pelo typescript-eslint (usado pelo eslint-config-next).
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dependencias:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 ainda não é suportado pelo typescript-eslint (usado pelo eslint-config-next).
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dependencias:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
